name: Python checks

on: [push]

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install black ruff

      - name: Run black
        run: black --check .

      - name: Run ruff
        run: ruff check .
